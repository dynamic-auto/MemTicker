name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Needed so `git describe` can find tags for the version string.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: ./build.sh

      - name: Verify the binary is universal
        run: lipo -info build/MemTicker.app/Contents/MacOS/MemTicker

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemTicker-dmg
          path: build/MemTicker.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MemTicker.dmg
          generate_release_notes: true
          body: |
            ### Install

            Download `MemTicker.dmg`, open it, and drag MemTicker to Applications.

            This build is **not notarized by Apple**, so the first launch is blocked.
            Right-click MemTicker in Applications and choose **Open**, then confirm.
            You only have to do this once.
